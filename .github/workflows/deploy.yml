name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Import completed antiOS demo if not already versioned
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s public/media/antios.mp4 ]; then
            mkdir -p public/media
            gh run download 45669763761 --repo "$GITHUB_REPOSITORY" --name antios-real-demo --dir public/media
            test -s public/media/antios.mp4
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/media/antios.mp4
            git commit -m "media: preserve generated antiOS demo"
            git push origin HEAD:main
          fi
      - name: Import completed RaftDB demo and transcript if not already versioned
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s public/media/raftdb.mp4 ] || [ ! -s public/media/raftdb-transcript.txt ]; then
            mkdir -p public/media
            gh run download 45669763761 --repo "$GITHUB_REPOSITORY" --name raftdb-real-demo --dir public/media
            test -s public/media/raftdb.mp4
            test -s public/media/raftdb-transcript.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/media/raftdb.mp4 public/media/raftdb-transcript.txt
            git commit -m "media: preserve verified RaftDB failover demonstration"
            git push origin HEAD:main
          fi
      - uses: actions/checkout@v5
        with:
          repository: andreyfemboyev/kernel-labs
          ref: 6541d0fc908ca330de58a77dc11d70eedef37
          path: kernel-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Kernel Lab film from real CLI execution
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pil
          cargo build --locked --release -p klab --manifest-path kernel-source/Cargo.toml
          /usr/bin/python3 media/kernel-demo.py
          test -s public/media/kernel-labs.mp4
          test -s public/media/kernel-labs-transcript.txt
          ffprobe -v error -show_format public/media/kernel-labs.mp4
          rm -rf kernel-source
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
